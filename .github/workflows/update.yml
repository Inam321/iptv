name: Update playlists

on:
  schedule:
    # 02:00 UTC daily = 07:00 Pakistan time
    - cron: "0 2 * * *"
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths:                  # only re-run on real changes, not doc edits
      - "scripts/**"
      - "config.json"
      - ".github/workflows/**"

permissions:
  contents: write           # needed to commit the refreshed playlists

concurrency:                # never let two runs fight over the same commit
  group: update-playlists
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 1. Rebuild sources from the iptv-org API.
      #    New channels added upstream get picked up here automatically.
      - name: Build playlists
        run: python scripts/build.py --config config.json --outdir build

      # 2. Test every stream, drop the dead ones, collapse duplicates.
      - name: Verify streams
        run: |
          python scripts/verify.py \
            --config config.json \
            --indir build \
            --outdir docs \
            --reportdir reports \
            --workers 40 \
            --timeout 8

      # 3. Rebuild the landing page from the fresh status data.
      - name: Build index page
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/make_index.py

      - name: Disable Jekyll on Pages
        run: touch docs/.nojekyll

      - name: Show summary in the run log
        run: cat STATUS.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs reports STATUS.md
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "Update playlists $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

      # Keeps the daily schedule alive. GitHub disables cron on public repos
      # after 60 days without repository activity.
      - name: Keep schedule alive
        if: github.event_name == 'schedule'
        run: echo "scheduled run completed $(date -u)"
